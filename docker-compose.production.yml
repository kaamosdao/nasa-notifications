services:
  postgres:
    container_name: ${PROJECT_SLUG}_postgres
    image: dockerhub.timeweb.cloud/postgres:16.0-alpine
    platform: linux/amd64
    restart: unless-stopped
    env_file: postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    # Только на loopback: приложения ходят в базу по внутренней сети `internal`,
    # снаружи порт не нужен. Проброс на 0.0.0.0 выставлял бы Postgres в интернет —
    # docker публикует порты в обход ufw/iptables, так что фаервол тут не спасает.
    # Остаётся доступен локально с сервера (psql, дампы) и через `ssh -L 5432:...`.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestor:
    container_name: ${PROJECT_SLUG}_ingestor
    image: ${CI_REGISTRY_IMAGE}/ingestor:${VERSION_TAG}
    restart: unless-stopped
    env_file: ingestor.env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # consumer.disconnect() по SIGTERM: иначе ребалансировка группы висит до таймаута
    stop_grace_period: 20s

  frontend:
    container_name: ${PROJECT_SLUG}_frontend
    image: ${CI_REGISTRY_IMAGE}/frontend:${VERSION_TAG}
    restart: unless-stopped
    env_file: frontend.env
    networks:
      - internal
    # Наружу трафик пускает системный nginx (ansible/templates/nginx.conf) — он же
    # держит TLS. Публикация на 0.0.0.0 давала бы второй вход на сайт по http://IP:3000,
    # мимо сертификата, редиректа www→apex и кеша.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s

volumes:
  postgres-data:
    name: ${PROJECT_SLUG}_postgres-data

networks:
  internal:
    name: ${PROJECT_SLUG}_internal
    driver: bridge
