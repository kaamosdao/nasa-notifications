# Cache zones configuration
proxy_cache_path /var/cache/nginx/frontend
    levels=1:2
    keys_zone=frontend_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# Upstream definitions
upstream frontend {
    server localhost:3000;
    keepalive 32;
}

# Map for cache bypass conditions
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Map for determining if request should bypass cache
map $request_method $no_cache {
    default 0;
    POST    1;
    PUT     1;
    DELETE  1;
    PATCH   1;
}

{% if nginx_www_redirect | bool %}
# ============================================================================
# Frontend - Production (www.{{ domain }} -> {{ domain }} redirect)
#
# Блок рендерится только для apex-домена. Для поддомена (gcn.example.com)
# www.gcn.example.com не существует в DNS, и certbot уронил бы весь выпуск
# сертификата на проверке этого имени.
# ============================================================================
server {
    server_name www.{{ domain }};
    server_tokens off;

    # Redirect www to non-www
    return 301 https://{{ domain }}$request_uri;
}
{% endif %}

# ============================================================================
# Frontend - Production ({{ domain }})
# ============================================================================
server {
    server_name {{ domain }};
    server_tokens off;
    client_max_body_size 20M;

    # ------------------------------------------------------------------------
    # SSE-поток оповещений.
    #
    # Отдельная локация нужна ровно из-за буферизации: с дефолтным proxy_buffering
    # nginx копит ответ и отдаёт события пачками с задержкой в десятки секунд —
    # лента выглядит «залипшей», хотя приложение работает. Апстрим дополнительно
    # шлёт X-Accel-Buffering: no, здесь это дублируется явно.
    #
    # proxy_read_timeout поднят: между событиями GCN может молчать часами, а пинг
    # раз в 15 с лишь удерживает соединение — рвать его по таймауту нельзя.
    # ------------------------------------------------------------------------
    location /api/stream {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;
    }

    # Main location - Next.js application
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Next.js HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_redirect off;
    }

    # Next.js static files - long-term caching
    location /_next/static {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;

        proxy_cache frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $no_cache;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets caching - CSS, JS, images, fonts, etc.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive caching for static assets
        proxy_cache frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $no_cache;

        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
