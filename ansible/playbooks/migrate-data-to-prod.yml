---
# Export Postgres dump + uploads from a remote source host (Docker volumes).
- name: Export Postgres dump and uploads from source server
  hosts: source
  gather_facts: false
  # sudo здесь НЕ нужен: play только запускает docker (достаточно членства в группе `docker`)
  # и пишет во временный каталог внутри /tmp. Раньше стоял `become: true` «на всякий случай»,
  # из-за чего подключение не под root падало с "Missing sudo password" на первой же задаче.
  # Проверить доступ на source: ssh <user>@<source> 'docker ps'
  become: false
  vars:
    migrate_export_dir: /tmp/boilerplate-migrate-export
    source_postgres_container: "{{ (source_project_slug | default(hostvars[groups['production'][0]].project_slug)) }}_postgres"
    source_uploads_volume: "{{ (source_project_slug | default(hostvars[groups['production'][0]].project_slug)) }}_strapi-uploads"

  tasks:
    - name: Skip source export for local migration
      ansible.builtin.meta: end_play
      when: migrate_source | default('local') != 'remote'

    - name: Check source postgres container exists
      ansible.builtin.command: docker ps -a --format '{% raw %}{{.Names}}{% endraw %}'
      register: source_docker_containers
      changed_when: false

    - name: Fail if source postgres container is missing
      ansible.builtin.assert:
        that:
          - source_postgres_container in source_docker_containers.stdout_lines
        fail_msg: >-
          Source postgres container not found: {{ source_postgres_container }}.
          Set source_project_slug in [source:vars] if the slug differs from production.

    - name: Recreate export directory on source
      ansible.builtin.file:
        path: "{{ migrate_export_dir }}"
        state: "{{ item }}"
        mode: "0700"
      loop:
        - absent
        - directory

    - name: Dump Postgres database on source
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec {{ source_postgres_container }} \
          sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
          > {{ migrate_export_dir }}/db.dump
      args:
        executable: /bin/bash

    - name: Archive uploads volume on source
      ansible.builtin.shell: |
        set -euo pipefail
        docker run --rm \
          -v {{ source_uploads_volume }}:/source:ro \
          -v {{ migrate_export_dir }}:/export \
          alpine:3.20 \
          sh -c 'tar -czf /export/uploads.tar.gz -C /source .'
      args:
        executable: /bin/bash

- name: Migrate Postgres dump and uploads to production
  hosts: production
  become: true
  gather_facts: true

  vars:
    project_dir: "/var/www/{{ project_user }}"
    migrate_work_dir: "{{ project_dir }}/migrate/{{ ansible_date_time.epoch }}"
    migrate_export_dir: /tmp/boilerplate-migrate-export
    postgres_container: "{{ project_slug }}_postgres"
    backend_container: "{{ project_slug }}_backend"
    imgproxy_container: "{{ project_slug }}_imgproxy"
    strapi_uploads_volume: "{{ project_slug }}_strapi-uploads"
    strapi_node_uid: 1000
    strapi_node_gid: 1000

  pre_tasks:
    - name: Validate required runtime vars
      ansible.builtin.assert:
        that:
          - project_user is defined
          - project_user | length > 0
          - project_group is defined
          - project_group | length > 0
          - project_slug is defined
          - project_slug | length > 0
          - migrate_source is defined
          - migrate_source in ['local', 'remote']
        fail_msg: >-
          Pass project_user/project_group/project_slug and migrate_source
          via ./run.sh or -e.

    - name: Validate local source paths
      when: migrate_source == 'local'
      ansible.builtin.assert:
        that:
          - migrate_local_db_path is defined
          - migrate_local_db_path | length > 0
          - migrate_local_uploads_path is defined
          - migrate_local_uploads_path | length > 0
        fail_msg: >-
          For migrate_source=local pass via ./run.sh or -e:
          migrate_local_db_path=/path/to/db.dump
          migrate_local_uploads_path=/path/to/uploads

    - name: Check local Postgres dump exists
      when: migrate_source == 'local'
      ansible.builtin.stat:
        path: "{{ migrate_local_db_path }}"
      delegate_to: localhost
      become: false
      register: local_db_file

    - name: Check local uploads directory exists
      when: migrate_source == 'local'
      ansible.builtin.stat:
        path: "{{ migrate_local_uploads_path }}"
      delegate_to: localhost
      become: false
      register: local_uploads_dir

    - name: Fail if local source files are missing
      when: migrate_source == 'local'
      ansible.builtin.assert:
        that:
          - local_db_file.stat.exists
          - local_uploads_dir.stat.exists
          - local_uploads_dir.stat.isdir
        fail_msg: >-
          Local source files not found:
          db={{ migrate_local_db_path }}, uploads={{ migrate_local_uploads_path }}

    - name: Validate source inventory group for remote migration
      when: migrate_source == 'remote'
      ansible.builtin.assert:
        that:
          - groups['source'] is defined
          - groups['source'] | length > 0
        fail_msg: >-
          For migrate_source=remote add a [source] host
          (./run.sh asks for it, or put it in inventory/hosts.ini).

  tasks:
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Create migration work directory
      ansible.builtin.file:
        path: "{{ migrate_work_dir }}"
        state: directory
        mode: "0750"

    - name: Copy local Postgres dump to production
      when: migrate_source == 'local'
      ansible.builtin.copy:
        src: "{{ migrate_local_db_path }}"
        dest: "{{ migrate_work_dir }}/db.dump"
        mode: "0644"

    - name: Archive local uploads on control machine
      when: migrate_source == 'local'
      ansible.builtin.archive:
        path: "{{ migrate_local_uploads_path }}"
        dest: "/tmp/boilerplate-migrate-uploads-{{ ansible_date_time.epoch }}.tar.gz"
        format: gz
      delegate_to: localhost
      become: false
      register: local_uploads_archive

    - name: Copy uploads archive to production
      when: migrate_source == 'local'
      ansible.builtin.copy:
        src: "{{ local_uploads_archive.dest }}"
        dest: "{{ migrate_work_dir }}/uploads.tar.gz"
        mode: "0644"

    - name: Extract local uploads archive on production
      when: migrate_source == 'local'
      ansible.builtin.unarchive:
        src: "{{ migrate_work_dir }}/uploads.tar.gz"
        dest: "{{ migrate_work_dir }}"
        remote_src: true

    - name: Normalize uploads directory after local extraction
      when: migrate_source == 'local'
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -d "{{ migrate_work_dir }}/uploads" ]; then
          exit 0
        fi
        extracted_dir="$(find "{{ migrate_work_dir }}" -mindepth 1 -maxdepth 1 -type d ! -name uploads | head -n 1)"
        if [ -n "$extracted_dir" ]; then
          mv "$extracted_dir" "{{ migrate_work_dir }}/uploads"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove local uploads archive from control machine
      when: migrate_source == 'local'
      ansible.builtin.file:
        path: "{{ local_uploads_archive.dest }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Transfer data from remote source
      ansible.builtin.include_tasks:
        file: tasks/migrate-from-remote-source.yml
      when: migrate_source == 'remote'

    - name: Check containers on production
      ansible.builtin.command: docker ps -a --format '{% raw %}{{.Names}}{% endraw %}'
      register: docker_containers
      changed_when: false

    - name: Fail if production postgres container is missing
      ansible.builtin.assert:
        that:
          - postgres_container in docker_containers.stdout_lines
        fail_msg: >-
          Production postgres container not found: {{ postgres_container }}.
          Deploy the stack before migrating data.

    - name: Stop backend before replacing data
      when:
        - migrate_stop_services | default(true) | bool
        - backend_container in docker_containers.stdout_lines
      ansible.builtin.command: docker stop {{ backend_container }}
      register: backend_stop
      changed_when: backend_stop.rc == 0

    - name: Stop imgproxy before replacing uploads
      when:
        - migrate_stop_services | default(true) | bool
        - imgproxy_container in docker_containers.stdout_lines
      ansible.builtin.command: docker stop {{ imgproxy_container }}
      register: imgproxy_stop
      changed_when: imgproxy_stop.rc == 0

    - name: Backup current Postgres database
      when: migrate_backup | default(true) | bool
      ansible.builtin.shell: |
        set -euo pipefail
        backup_dir="{{ migrate_work_dir }}/backup"
        mkdir -p "$backup_dir"
        docker exec {{ postgres_container }} \
          sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
          > "$backup_dir/db.dump"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup current uploads volume
      when: migrate_backup | default(true) | bool
      ansible.builtin.shell: |
        set -euo pipefail
        backup_dir="{{ migrate_work_dir }}/backup"
        mkdir -p "$backup_dir"
        docker run --rm \
          -v {{ strapi_uploads_volume }}:/source:ro \
          -v "$backup_dir":/backup \
          alpine:3.20 \
          sh -c 'if [ -d /source ] && [ "$(ls -A /source 2>/dev/null)" ]; then tar -czf /backup/uploads.tar.gz -C /source .; fi'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Copy dump into postgres container
      ansible.builtin.command: >-
        docker cp {{ migrate_work_dir }}/db.dump {{ postgres_container }}:/tmp/db.dump

    - name: Restore Postgres dump into production database
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec {{ postgres_container }} \
          sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner --no-acl /tmp/db.dump'
        docker exec {{ postgres_container }} rm -f /tmp/db.dump
      args:
        executable: /bin/bash

    - name: Import uploads into Docker volume
      ansible.builtin.shell: |
        set -euo pipefail
        docker run --rm \
          -v {{ strapi_uploads_volume }}:/dest \
          -v "{{ migrate_work_dir }}/uploads":/src:ro \
          alpine:3.20 \
          sh -c '
            rm -rf /dest/*
            cp -a /src/. /dest/
            chown -R {{ strapi_node_uid }}:{{ strapi_node_gid }} /dest
          '
      args:
        executable: /bin/bash

    - name: Start backend after migration
      when:
        - migrate_stop_services | default(true) | bool
        - backend_container in docker_containers.stdout_lines
      ansible.builtin.command: docker start {{ backend_container }}
      register: backend_start
      changed_when: backend_start.rc == 0

    - name: Start imgproxy after migration
      when:
        - migrate_stop_services | default(true) | bool
        - imgproxy_container in docker_containers.stdout_lines
      ansible.builtin.command: docker start {{ imgproxy_container }}
      register: imgproxy_start
      changed_when: imgproxy_start.rc == 0

    - name: Show migration result
      ansible.builtin.debug:
        msg:
          - "Postgres dump restored into {{ postgres_container }}"
          - "Uploads imported to volume {{ strapi_uploads_volume }}"
          - "Work dir: {{ migrate_work_dir }}"
          - "Backup dir: {{ migrate_work_dir }}/backup"
          - "Meilisearch was not migrated — reindex from Strapi if needed"
