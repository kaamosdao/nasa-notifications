---
- name: Production routine setup
  hosts: production
  become: true
  gather_facts: true

  vars:
    project_dir: "/var/www/{{ project_user }}"
    # Репозиторий Docker подбирается под РЕЛИЗ ХОСТА (из facts), а не прибит к jammy.
    # Жёсткий `jammy` на сервере с другой Ubuntu ставит пакеты «не от той» версии ОС
    # и приводит к конфликтам файлов с системными пакетами.
    # Переопределить через -e, если Docker ещё не опубликовал пакеты под свежий релиз
    # (список: https://download.docker.com/linux/ubuntu/dists/).
    docker_ubuntu_codename: "{{ ansible_distribution_release }}"
    docker_apt_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    nginx_site_name: "{{ project_user }}"
    nginx_site_path: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    nginx_enabled_path: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    nginx_config_src: "{{ playbook_dir }}/../templates/nginx.conf"

    # Все ключи из keys/, а не один keys/<project_user>.pub: на сервер должны попасть
    # и личный ключ разработчика, и ключ, которым ходит CI. authorized_key работает
    # в режиме present, то есть добавляет, не затирая остальные.
    project_ssh_key_dir: "{{ playbook_dir }}/../keys"

    # www-редирект имеет смысл только для apex-домена: у поддомена
    # (gcn.testing-nasa-notifications.com) www.gcn.… никто не регистрирует, а лишний
    # server_name попал бы в запрос сертификата и уронил бы выпуск целиком —
    # certbot требует, чтобы КАЖДЫЙ домен из -d прошёл проверку.
    # Эвристика по числу меток; для доменов вида example.co.uk переопределите
    # вручную: -e nginx_www_redirect=true
    nginx_www_redirect: "{{ (domain | split('.') | length) == 2 }}"

  pre_tasks:
    - name: Validate required runtime vars
      ansible.builtin.assert:
        that:
          - project_user is defined
          - project_user | length > 0
          - project_group is defined
          - project_group | length > 0
          - domain is defined
          - domain | length > 0
        fail_msg: >-
          Pass project_user/project_group/domain via ./run.sh
          or -e "project_user=... project_group=... domain=...".

    - name: Validate nginx config file exists on control machine
      ansible.builtin.stat:
        path: "{{ nginx_config_src }}"
      delegate_to: localhost
      become: false
      register: nginx_config_file

    - name: Read every public key file from keys/
      ansible.builtin.slurp:
        src: "{{ item }}"
      delegate_to: localhost
      become: false
      loop: "{{ query('fileglob', project_ssh_key_dir ~ '/*.pub') | sort }}"
      register: ssh_key_files

    - name: Fail if required local files are missing
      ansible.builtin.assert:
        that:
          - nginx_config_file.stat.exists
          - ssh_key_files.results | length > 0
        fail_msg: >-
          Missing required file(s). Ensure {{ nginx_config_src }} exists
          and {{ project_ssh_key_dir }}/ contains at least one *.pub key.

    - name: Build the list of SSH public keys
      ansible.builtin.set_fact:
        project_ssh_public_keys: >-
          {{ ssh_key_files.results
             | map(attribute='content') | map('b64decode') | map('trim') | list }}

    # Проверяем ВЕСЬ файл, а не только его начало.
    # `is match` якорится на начало строки, поэтому файл вида
    #   ssh-rsa AAAA... mac
    #   https:///
    # раньше проходил проверку: первая строка валидна, а лишний мусор во второй
    # всплывал только позже — падением ansible.posix.authorized_key, который
    # разбирает содержимое построчно ("invalid key specified: ...").
    # Контракт: в файле ровно один ключ, одной строкой.
    - name: Validate every loaded SSH key format
      ansible.builtin.assert:
        that:
          - item.splitlines() | length == 1
          - item is match("^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256)\\s+\\S+")
        fail_msg: >-
          Invalid SSH public key in {{ project_ssh_key_dir }}/:
          expected exactly ONE line "<type> <base64> [comment]",
          got {{ item.splitlines() | length }} line(s).
      loop: "{{ project_ssh_public_keys }}"
      loop_control:
        label: "{{ item.split() | last }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base dependencies
      ansible.builtin.apt:
        name:
          - curl
          - software-properties-common
          - ca-certificates
          - apt-transport-https
          - gnupg
          - lsb-release
          - wget
        state: present

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Enable nginx service
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Install certbot packages
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Ensure docker keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        set -euo pipefail
        wget -qO- https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor > /etc/apt/keyrings/docker.gpg
        chmod 0644 /etc/apt/keyrings/docker.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ docker_ubuntu_codename }} stable

    - name: Show docker-ce apt policy
      ansible.builtin.command: apt-cache policy docker-ce
      changed_when: false

    # ⚠️ Пакет `docker-compose` (Compose v1 из репозитория Ubuntu) сюда НЕ добавлять.
    # Это transitional-пакет, который тянет `docker-compose-v2`, а тот кладёт тот же файл
    # /usr/libexec/docker/cli-plugins/docker-compose, что и `docker-compose-plugin` из
    # репозитория Docker → dpkg падает с "trying to overwrite ... which is also in package".
    # Compose v2 приезжает плагином вместе с docker-ce, а проект везде использует синтаксис
    # `docker compose` (без дефиса) — отдельный бинарник v1 не нужен.
    # Список пакетов — официальный из докуменации Docker.
    - name: Install docker packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # Проверяем сразу здесь, а не при первом деплое: CI выполняет `docker compose ...`,
    # и отсутствующий плагин иначе всплывёт только в момент выката.
    - name: Verify Docker Compose v2 is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Create project user
      ansible.builtin.user:
        name: "{{ project_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
        state: present

    # Только frontend: в templates/nginx.conf объявлена одна зона — frontend_cache.
    # Зоны api_cache (Strapi) в этом проекте нет, бэкенда за nginx тоже.
    - name: Create nginx cache directory
      ansible.builtin.file:
        path: /var/cache/nginx/frontend
        state: directory
        mode: "0755"

    - name: Render nginx site config from template
      ansible.builtin.template:
        src: "{{ nginx_config_src }}"
        dest: "{{ nginx_site_path }}"
        mode: "0644"

    - name: Enable nginx site
      ansible.builtin.file:
        src: "{{ nginx_site_path }}"
        dest: "{{ nginx_enabled_path }}"
        state: link

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_group }}"
        mode: "0755"

    - name: Ensure .ssh directory exists for project user
      ansible.builtin.file:
        path: "/home/{{ project_user }}/.ssh"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_group }}"
        mode: "0700"

    - name: Install authorized keys from keys/
      ansible.posix.authorized_key:
        user: "{{ project_user }}"
        state: present
        key: "{{ item }}"
      loop: "{{ project_ssh_public_keys }}"
      loop_control:
        label: "{{ item.split() | last }}"

    - name: Ensure authorized_keys permissions
      ansible.builtin.file:
        path: "/home/{{ project_user }}/.ssh/authorized_keys"
        state: file
        owner: "{{ project_user }}"
        group: "{{ project_group }}"
        mode: "0600"
