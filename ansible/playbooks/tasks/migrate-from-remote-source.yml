---
- name: Push exported files from source server to production
  ansible.posix.synchronize:
    src: "{{ migrate_export_dir }}/"
    dest: >-
      {{ hostvars[groups['production'][0]].ansible_user | default('ubuntu') }}@{{ hostvars[groups['production'][0]].ansible_host }}:{{ migrate_work_dir }}/
    # ⚠️ ЛЮБОЕ значение в rsync_opts, содержащее ПРОБЕЛ, обязано нести внутренние кавычки.
    # Модуль экранирует только собственные аргументы, а элементы rsync_opts вставляет
    # в командную строку как есть — и шелл разбивает их по пробелам. Без кавычек
    # `--rsync-path=sudo rsync` превращается в `--rsync-path=sudo` + лишний путь `rsync`,
    # на приёмнике запускается `sudo --server …`, и sudo падает с
    # "'log-format' does not take any arguments".
    #
    # По той же причине сюда НЕЛЬЗЯ класть свой `--rsh` с ssh-опциями: `-S`, `-o` станут
    # ключами самого rsync (--sparse, --owner), а их значения — исходными путями, после чего
    # rsync виснет, даже не открыв ssh-сессию. `--rsh` модуль `synchronize` формирует сам
    # (там уже есть StrictHostKeyChecking=no из-за `host_key_checking = False` в ansible.cfg).
    rsync_opts:
      # sudo нужен, потому что migrate_work_dir на проде создаётся под root.
      # Требует NOPASSWD у пользователя прода: интерактивный пароль сюда ввести некому
      # (`--ask-become-pass` на эту вложенную ssh-сессию не распространяется).
      - "--rsync-path='sudo rsync'"
  delegate_to: "{{ groups['source'][0] }}"
  become: false

- name: Ensure uploads directory exists after remote transfer
  ansible.builtin.file:
    path: "{{ migrate_work_dir }}/uploads"
    state: directory
    mode: "0755"

- name: Extract uploads archive from remote source into uploads/
  ansible.builtin.shell: |
    set -euo pipefail
    tar -xzf "{{ migrate_work_dir }}/uploads.tar.gz" -C "{{ migrate_work_dir }}/uploads"
  args:
    executable: /bin/bash
  changed_when: false

- name: Cleanup export directory on source server
  ansible.builtin.file:
    path: "{{ migrate_export_dir }}"
    state: absent
  delegate_to: "{{ groups['source'][0] }}"
  # Каталог создал сам пользователь source в /tmp и является его владельцем, поэтому
  # удалить его он может без sudo (файлы внутри могут принадлежать root после `docker run`,
  # но право на удаление даёт владение КАТАЛОГОМ, а sticky-бит стоит на /tmp, не на нём).
  # `become: true` здесь ломал бы подключение не под root — см. play выше.
  become: false
