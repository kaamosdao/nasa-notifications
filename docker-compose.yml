services:
  postgres:
    container_name: ${PROJECT_SLUG}_postgres
    platform: linux/amd64 #for platform error on Apple M1 chips
    image: dockerhub.timeweb.cloud/postgres:16.0-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestor:
    container_name: ${PROJECT_SLUG}_ingestor
    build:
      context: .
      dockerfile: ./docker/ingestor/${ENVIRONMENT}/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/ingestor:/app/services/ingestor
      - ingestor-node-modules:/app/services/ingestor/node_modules
    networks:
      - internal
    env_file:
      - ./.env
    environment:
      # внутри compose Postgres доступен по имени сервиса, а не по localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # consumer.disconnect() по SIGTERM: иначе ребалансировка группы висит до таймаута
    stop_grace_period: 20s

  frontend:
    container_name: ${PROJECT_SLUG}_frontend
    build:
      context: .
      dockerfile: ./docker/frontend/${ENVIRONMENT}/Dockerfile
      args:
        - NODE_ENV=${ENVIRONMENT}
    restart: unless-stopped
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "3000:3000"
    networks:
      - internal
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: ${PROJECT_SLUG}_postgres-data
  frontend-node-modules:
    name: ${PROJECT_SLUG}_frontend-node-modules
  frontend-next:
    name: ${PROJECT_SLUG}_frontend-next
  ingestor-node-modules:
    name: ${PROJECT_SLUG}_ingestor-node-modules

networks:
  internal:
    name: ${PROJECT_SLUG}_network_internal
    driver: bridge
