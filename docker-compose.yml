services:
  postgres:
    container_name: ${PROJECT_SLUG}_postgres
    # pgvector — официальный Postgres 16 (debian) с расширением vector для RAG
    image: dockerhub.timeweb.cloud/pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      # порт на хосте переопределяется, если 5432 занят локальным Postgres
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestor:
    container_name: ${PROJECT_SLUG}_ingestor
    build:
      context: .
      dockerfile: ./docker/ingestor/${ENVIRONMENT}/Dockerfile
    restart: unless-stopped
    volumes:
      - ./services/ingestor:/app/services/ingestor
      - ingestor-node-modules:/app/services/ingestor/node_modules
    networks:
      - internal
    env_file:
      - ./.env
    environment:
      # внутри compose Postgres доступен по имени сервиса, а не по localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # consumer.disconnect() по SIGTERM: иначе ребалансировка группы висит до таймаута
    stop_grace_period: 20s

  frontend:
    container_name: ${PROJECT_SLUG}_frontend
    build:
      context: .
      dockerfile: ./docker/frontend/${ENVIRONMENT}/Dockerfile
      args:
        - NODE_ENV=${ENVIRONMENT}
    restart: unless-stopped
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "3000:3000"
    networks:
      - internal
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy

  # Опционально (`docker compose --profile ollama up`): на Mac Ollama ставится нативно —
  # в Docker на Mac нет доступа к GPU. Логика старта — как в docker-compose.production.yml.
  ollama:
    container_name: ${PROJECT_SLUG}_ollama
    image: dockerhub.timeweb.cloud/ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    # не env_file: контейнеру не нужны секреты GCN и БД
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        trap 'kill $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_EMBED_MODEL" || echo "pull $$OLLAMA_EMBED_MODEL failed"
        if [ "$$LLM_PROVIDER" = "ollama" ]; then
          ollama pull "$$OLLAMA_CHAT_MODEL" || echo "pull $$OLLAMA_CHAT_MODEL failed"
        fi
        wait $$pid
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - internal

volumes:
  postgres-data:
    name: ${PROJECT_SLUG}_postgres-data
  ollama-models:
    name: ${PROJECT_SLUG}_ollama-models
  frontend-node-modules:
    name: ${PROJECT_SLUG}_frontend-node-modules
  frontend-next:
    name: ${PROJECT_SLUG}_frontend-next
  ingestor-node-modules:
    name: ${PROJECT_SLUG}_ingestor-node-modules

networks:
  internal:
    name: ${PROJECT_SLUG}_network_internal
    driver: bridge
