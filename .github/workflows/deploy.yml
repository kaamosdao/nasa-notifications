name: Build & Deploy

# Прод один, поэтому и ветка одна: push в main катится на сервер.
# workflow_dispatch оставлен для повторного выката без нового коммита (например,
# после смены секрета — образы пересоберутся с новым frontend.env).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Два параллельных деплоя на один сервер сделали бы `docker compose up` гонкой
# за одни и те же контейнеры. Новый пуш отменяет предыдущий ещё не дошедший до сервера.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PROJECT_SLUG: nasa-notifications

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR принимает только нижний регистр, а github.repository повторяет
      # регистр имени пользователя/организации. Приводим один раз здесь.
      - name: Resolve image base and tag
        run: |
          echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Сборка env-файлов из ci/env/*.env.tpl — ровно как это делал prepare_env
      # в GitLab-компоненте. Файлы нужны дважды: как BuildKit-секрет для сборки
      # фронта и как env_file рядом с compose на сервере.
      - name: Generate env files
        env:
          # DATABASE_URL НЕ хранится секретом целиком: внутри compose-сети хост
          # всегда `postgres`, и собранная здесь строка не даёт ошибиться с localhost —
          # с ним ingestor и frontend в контейнере просто не найдут базу.
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          GCN_CLIENT_ID: ${{ secrets.GCN_CLIENT_ID }}
          GCN_CLIENT_SECRET: ${{ secrets.GCN_CLIENT_SECRET }}
          GCN_TOPICS: ${{ vars.GCN_TOPICS }}
          GCN_BACKFILL_DAYS: ${{ vars.GCN_BACKFILL_DAYS || '7' }}
          # Группа обязана отличаться от локальной (.env): при общей группе Kafka
          # делит партиции между dev и прод, а закоммиченные локально offset'ы
          # отключают backfill на проде — лента остаётся пустой.
          GCN_CONSUMER_GROUP: ${{ vars.GCN_CONSUMER_GROUP || 'nasa-notifications-production' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_YANDEX_TRACKING_ID: ${{ vars.NEXT_PUBLIC_YANDEX_TRACKING_ID }}
          NOTICES_LIVE_LIMIT: ${{ vars.NOTICES_LIVE_LIMIT || '500' }}
          # AI-чат (docs/16-ai-chat.md). Провайдер переключается переменной без правки кода.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'ollama' }}
          # На CPU-сервере 8 GB помещается только малая модель
          OLLAMA_CHAT_MODEL: ${{ vars.OLLAMA_CHAT_MODEL || 'qwen3:4b' }}
          OLLAMA_EMBED_MODEL: ${{ vars.OLLAMA_EMBED_MODEL || 'nomic-embed-text' }}
          # Без GPU параллельные генерации лишь делят CPU: очередь честнее
          OLLAMA_NUM_PARALLEL: ${{ vars.OLLAMA_NUM_PARALLEL || '1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          # Короткие объяснения не требуют глубоких размышлений; для haiku-4-5 — none
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'low' }}
          CHAT_RATE_PER_MIN: ${{ vars.CHAT_RATE_PER_MIN || '10' }}
          CHAT_RATE_PER_DAY: ${{ vars.CHAT_RATE_PER_DAY || '50' }}
          CHAT_DAILY_CAP: ${{ vars.CHAT_DAILY_CAP || '1000' }}
        run: |
          set -euo pipefail

          # fail fast: пустой секрет иначе всплывёт только падением контейнера на сервере
          for var in DATABASE_USERNAME DATABASE_PASSWORD DATABASE_NAME \
                     GCN_CLIENT_ID GCN_CLIENT_SECRET NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required variable $var is empty. Set it in repo Settings → Secrets and variables."
              exit 1
            fi
          done

          if [ "$LLM_PROVIDER" = "anthropic" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::LLM_PROVIDER=anthropic requires secret ANTHROPIC_API_KEY."
            exit 1
          fi

          export PROJECT_SLUG="${PROJECT_SLUG}"
          export DATABASE_URL="postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}"

          for svc in frontend ingestor postgres ollama; do
            envsubst < "ci/env/${svc}.env.tpl" > "${svc}.env"
          done

          # Значения, которые docker-compose.production.yml подставляет в image:
          cat > .env <<EOF
          PROJECT_SLUG=${PROJECT_SLUG}
          CI_REGISTRY_IMAGE=${IMAGE_BASE}
          VERSION_TAG=${VERSION_TAG}
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Фронту нужен frontend.env на этапе `pnpm build`: NEXT_PUBLIC_* впекаются
      # в бандл. Передаём секретом BuildKit, а не build-arg — build-arg остался бы
      # в истории слоёв образа.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/production/Dockerfile
          push: true
          secret-files: |
            frontend_env=frontend.env
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ env.VERSION_TAG }}
            ${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push ingestor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ingestor/production/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/ingestor:${{ env.VERSION_TAG }}
            ${{ env.IMAGE_BASE }}/ingestor:latest
          cache-from: type=gha,scope=ingestor
          cache-to: type=gha,mode=max,scope=ingestor

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ хоста берём один раз здесь, а не отключаем проверку:
          # StrictHostKeyChecking=no принял бы и чужой сервер при подмене DNS.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # Токен живёт только до конца этого job — его хватает на pull прямо сейчас.
          # Для ручного `docker compose pull` на сервере позже понадобится
          # свой `docker login ghcr.io` (см. docs/08-ci-cd.md).
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes ${SSH_USER}@${SSH_HOST}"
          REMOTE_DIR="/var/www/${SSH_USER}"

          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            docker-compose.production.yml .env frontend.env ingestor.env postgres.env ollama.env \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"

          $SSH bash -euo pipefail <<REMOTE
            cd "${REMOTE_DIR}"
            # env-файлы содержат пароль БД и секреты GCN — не для чужих глаз на сервере
            chmod 600 .env frontend.env ingestor.env postgres.env ollama.env

            echo "${REGISTRY_TOKEN}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker logout ${REGISTRY}

            docker compose -f docker-compose.production.yml ps
          REMOTE
